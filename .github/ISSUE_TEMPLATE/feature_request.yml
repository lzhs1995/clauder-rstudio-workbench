name: Feature request
description: Suggest an installer, skill, MCP workflow, or documentation improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Keep requests portable. Do not include private paths, unpublished research data, or tokens.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installer
        - Codex skill instructions
        - Claude Code / Copilot MCP setup
        - Async progress workflow
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is currently hard, unsafe, or unclear?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: How should this be validated?
      description: Example install command, MCP smoke, or documentation check.
