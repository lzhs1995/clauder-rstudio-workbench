name: connection-reliability
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  config-and-protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python -m unittest tests.test_config_store tests.test_readiness tests.test_runtime_install_defaults tests.test_native_evidence_portability tests.test_connection_diagnostics -v
        env:
          PYTHONUTF8: '1'
      - name: Windows PowerShell 5.1 runtime writer checks
        if: runner.os == 'Windows'
        run: ./.github/scripts/test_config_writers.ps1
        shell: powershell
      - name: PowerShell 7 runtime writer checks
        if: runner.os == 'Windows'
        run: ./.github/scripts/test_config_writers.ps1
        shell: pwsh
