name: mplus-guide family tests

# 按 skills/mplusautomation-guide/families.json 跑各家族的合成合同测试；不启动 Mplus。
# 只改 references 等文档时不跑本矩阵，注册表校验见 mplus-guide-registry.yml。
on:
  pull_request:
    paths:
      - skills/mplusautomation-guide/scripts/**
      - skills/mplusautomation-guide/assets/**
      - skills/mplusautomation-guide/families.json
      - .github/workflows/mplus-guide-family-tests.yml
  push:
    branches: [main]
    paths:
      - skills/mplusautomation-guide/scripts/**
      - skills/mplusautomation-guide/assets/**
      - skills/mplusautomation-guide/families.json
      - .github/workflows/mplus-guide-family-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-family-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install XQuartz for macOS template compilation
        if: runner.os == 'macOS'
        # MplusAutomation 的模板编译会加载 tcltk，macOS R 需要 X11 动态库。
        run: brew install --cask xquartz
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::MplusAutomation
            any::haven
            any::digest
            any::jsonlite
            any::ps
      - name: Registry-driven synthetic family contracts
        # 测试清单与平台限定（ci_os）都来自 families.json
        run: Rscript skills/mplusautomation-guide/scripts/run_family_ci_tests.R mplus-guide-family-tests.yml "${{ runner.temp }}/family-ci"
      - name: Upload synthetic contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-ci-${{ runner.os }}
          path: ${{ runner.temp }}/family-ci
          if-no-files-found: warn
          retention-days: 7
