name: comparegroups-guide

on:
  push:
    branches: [main, "feature/comparegroups-guide-v0.6.0"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform:
    name: ${{ matrix.os }} / R ${{ matrix.r }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        r: [release]

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # This repository is a skill collection, not an R package.  The
          # action defaults to `deps::.` and would therefore scan unrelated
          # CMAverse templates for packages that are intentionally not on
          # CRAN.  Install only this skill's explicit test dependencies.
          packages: |
            any::compareGroups
            any::haven
            any::labelled
            any::officer
            any::flextable
            any::jsonlite
            any::digest
            any::rmarkdown
            any::remotes

      - name: Pin compareGroups 4.10.3
        run: |
          remotes::install_version("compareGroups", version = "4.10.3", upgrade = "never")
          stopifnot(as.character(packageVersion("compareGroups")) == "4.10.3")
        shell: Rscript {0}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install -e ".[dev]"

      - name: Unified comparegroups suite
        run: python tests/run_comparegroups_suite.py

  comparegroups-4-10-2:
    name: ubuntu / compareGroups 4.10.2 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::compareGroups
            any::haven
            any::labelled
            any::officer
            any::flextable
            any::jsonlite
            any::digest
            any::rmarkdown
            any::remotes
      - name: Pin compareGroups 4.10.2
        run: |
          remotes::install_version("compareGroups", version = "4.10.2", upgrade = "never")
          stopifnot(as.character(packageVersion("compareGroups")) == "4.10.2")
        shell: Rscript {0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Unified compatibility suite
        run: python tests/run_comparegroups_suite.py

  repository-gates:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: skills/clauder-rstudio-workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Repository-wide Python suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate all three skills
        run: |
          python .github/scripts/quick_validate.py skills/clauder-rstudio-workbench
          python .github/scripts/quick_validate.py skills/cmaverse-paired-mval
          python .github/scripts/quick_validate.py skills/comparegroups-guide
        shell: bash
        env:
          PYTHONUTF8: "1"

      - name: Public-tree privacy scan
        run: python -m unittest tests.test_discovery_redaction_v044 -v
