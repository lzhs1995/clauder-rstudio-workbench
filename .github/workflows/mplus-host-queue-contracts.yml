name: mplus host and queue contracts

# 合成 SQLite/资源合同；不启动 R、Mplus 或真实 Windows 资源采样。
on:
  pull_request:
    paths:
      - skills/mplusautomation-guide/scripts/host_measured.py
      - skills/mplusautomation-guide/scripts/apim_v2_io.py
      - skills/mplusautomation-guide/scripts/mplus_queue.py
      - skills/mplusautomation-guide/scripts/process_ownership.py
      - skills/mplusautomation-guide/scripts/windows_memory.py
      - tests/__init__.py
      - tests/test_host_measured.py
      - tests/test_mplus_queue_autoscale_modes.py
      - tests/test_mplus_queue_byte_autoscale.py
      - tests/test_mplus_queue_init_policy.py
      - tests/test_mplus_queue_init_concurrency.py
      - tests/test_mplus_queue_resources.py
      - .github/workflows/mplus-host-queue-contracts.yml
  push:
    branches: [main]
    paths:
      - skills/mplusautomation-guide/scripts/host_measured.py
      - skills/mplusautomation-guide/scripts/apim_v2_io.py
      - skills/mplusautomation-guide/scripts/mplus_queue.py
      - skills/mplusautomation-guide/scripts/process_ownership.py
      - skills/mplusautomation-guide/scripts/windows_memory.py
      - tests/__init__.py
      - tests/test_host_measured.py
      - tests/test_mplus_queue_autoscale_modes.py
      - tests/test_mplus_queue_byte_autoscale.py
      - tests/test_mplus_queue_init_policy.py
      - tests/test_mplus_queue_init_concurrency.py
      - tests/test_mplus_queue_resources.py
      - .github/workflows/mplus-host-queue-contracts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contracts:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install queue test dependencies
        run: python -m pip install 'psutil>=5.9' 'pytest>=7'
      - name: Measured host and queue mode contracts
        run: >-
          python -B -m unittest -v
          tests.test_host_measured
          tests.test_mplus_queue_autoscale_modes
          tests.test_mplus_queue_byte_autoscale
          tests.test_mplus_queue_init_policy
          tests.test_mplus_queue_init_concurrency
      - name: Queue resource profile contracts
        run: python -B -m pytest -q tests/test_mplus_queue_resources.py
