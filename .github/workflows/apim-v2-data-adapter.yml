name: APIM v2 data adapter

on:
  pull_request:
    paths:
      - skills/mplusautomation-guide/**
      - .github/workflows/apim-v2-data-adapter.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-io-and-compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::MplusAutomation
            any::haven
            any::digest
            any::jsonlite
            any::ps
      - name: Synthetic DTA/CSV and APIM regression contracts
        shell: Rscript {0}
        run: |
          skill <- normalizePath('skills/mplusautomation-guide', winslash='/')
          evidence <- file.path(tempdir(), 'apim-data-adapter-evidence')
          dir.create(evidence)
          # 引擎路径仅用于准备/编译合同检查；这些测试不启动 Mplus。
          engine <- file.path(R.home('bin'), if (.Platform$OS.type=='windows') 'Rscript.exe' else 'Rscript')
          python <- unname(Sys.which('python'))
          source(file.path(skill, 'scripts/test_apim_v2_data_adapter.R'))
          test_apim_v2_data_adapter(skill, file.path(evidence, 'adapter'), engine, python)
          source(file.path(skill, 'scripts/test_apim_v2.R'))
          test_apim_v2(skill, file.path(evidence, 'v2'), engine, python)
          source(file.path(skill, 'scripts/test_workflow_contract.R'))
          test_apim_contract(file.path(skill, 'scripts'), file.path(evidence, 'v1'), engine, python)
