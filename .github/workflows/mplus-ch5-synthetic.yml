name: Mplus guide chapter 5 synthetic contract

on:
  pull_request:
    paths:
      - skills/mplusautomation-guide/assets/ch5/**
      - skills/mplusautomation-guide/scripts/ch5_mediation_moderation.R
      - skills/mplusautomation-guide/scripts/test_ch5_mediation_moderation_20261105.R
      - skills/mplusautomation-guide/references/mediation-moderation-workflow.md
      - skills/mplusautomation-guide/references/chapter5-replay-map.md
      - skills/mplusautomation-guide/scripts/run_family_ci_tests.R
      - skills/mplusautomation-guide/families.json
      - .github/workflows/mplus-ch5-synthetic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ch5-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::MplusAutomation
            any::sandwich
            any::lmtest
            any::digest
            any::jsonlite
      - name: Registry-driven chapter 5 synthetic contract
        # 测试清单来自 families.json（ci = mplus-ch5-synthetic.yml）；只生成合成 INP/DAT 并核计算函数，不启动 Mplus。
        # 单独成 workflow：静态调节测试需要 sandwich/lmtest，共用矩阵 mplus-guide-family-tests.yml 不装这两个包。
        run: Rscript skills/mplusautomation-guide/scripts/run_family_ci_tests.R mplus-ch5-synthetic.yml "${{ runner.temp }}/ch5-synthetic-ci"
      - name: Upload chapter 5 synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch5-synthetic-ci
          path: ${{ runner.temp }}/ch5-synthetic-ci
          if-no-files-found: warn
          retention-days: 7
