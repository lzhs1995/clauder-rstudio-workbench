name: Mplus guide chapter 5 synthetic contract

on:
  pull_request:
    paths:
      - skills/mplusautomation-guide/assets/ch5/**
      - skills/mplusautomation-guide/scripts/ch5_mediation_moderation.R
      - skills/mplusautomation-guide/scripts/test_ch5_mediation_moderation_20261105.R
      - skills/mplusautomation-guide/references/mediation-moderation-workflow.md
      - skills/mplusautomation-guide/references/chapter5-replay-map.md
      - .github/workflows/mplus-ch5-synthetic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ch5-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::MplusAutomation
            any::sandwich
            any::lmtest
            any::digest
            any::jsonlite
      - name: Chapter 5 mediation/moderation synthetic contract
        # 只生成合成 INP/DAT 并核计算函数，不启动 Mplus。
        run: Rscript skills/mplusautomation-guide/scripts/test_ch5_mediation_moderation_20261105.R "$RUNNER_TEMP/ch5-synthetic-ci"
      - name: Upload chapter 5 synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch5-synthetic-ci
          path: ${{ runner.temp }}/ch5-synthetic-ci
          if-no-files-found: warn
          retention-days: 7
