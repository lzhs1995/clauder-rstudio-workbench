[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clauder-rstudio-workbench-harness"
version = "0.7.0"
description = "Executable harnesses for ClaudeR RStudio workbench discipline"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0,<2", "psutil>=5.9", "pyyaml>=6", "tomlkit>=0.13,<1", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
fanout = ["pyyaml>=6", "psutil>=5.9"]
dev = ["pyyaml>=6", "psutil>=5.9", "jsonschema>=4.20", "pytest>=8", "setuptools>=68", "wheel>=0.41"]

[project.scripts]
clauder-workbench = "clauder_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["skills/clauder-rstudio-workbench"]
include = ["clauder_workbench*"]

[tool.setuptools.data-files]
"share/clauder-rstudio-workbench" = ["runtime-compatibility.json"]
