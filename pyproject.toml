[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clauder-rstudio-workbench-harness"
version = "0.4.5"
description = "Executable harnesses for ClaudeR RStudio workbench discipline"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0,<2", "psutil>=5.9", "pyyaml>=6"]

[project.optional-dependencies]
fanout = ["pyyaml>=6", "psutil>=5.9"]
dev = ["pyyaml>=6", "psutil>=5.9"]

[project.scripts]
clauder-workbench = "clauder_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["skills/clauder-rstudio-workbench"]
include = ["clauder_workbench*"]
